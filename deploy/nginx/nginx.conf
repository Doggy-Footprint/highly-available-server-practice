# L7 로드밸런서 — Phase 3 에서 ALB 가 대신할 자리.
# Phase 0 에서는 뜨지 않는다 (compose 의 `lb` 프로파일). `make up N=3` 부터 사용한다.

user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    # 부하 중 access log 는 디스크 I/O 로 측정을 오염시킨다 (macOS 도커에서 특히).
    access_log  off;
    error_log   /var/log/nginx/error.log  warn;

    sendfile      on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    server {
        listen 80;

        # docker DNS 를 동적으로 다시 조회한다 (§11).
        # 이게 없으면 nginx 가 기동 시점의 app 주소를 영구 캐시해서,
        # `--scale app=N` 으로 늘리거나 컨테이너가 재생성돼도 구주소로만 보낸다.
        # valid=5s 는 스케일 변화가 5초 안에 반영된다는 뜻.
        resolver 127.0.0.11 valid=5s ipv6=off;

        location / {
            # 변수를 거쳐야 nginx 가 요청마다 resolver 를 다시 탄다.
            # upstream 블록 + 고정 이름을 쓰면 위 resolver 가 적용되지 않는다.
            set $upstream_app app;

            # proxy_pass 에 변수를 쓰면 원본 URI 가 자동으로 붙지 않으므로
            # $request_uri 를 명시적으로 이어붙인다.
            proxy_pass http://$upstream_app:8000$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 타임아웃을 일부러 정렬하지 않는다 — nginx 기본값(proxy_read_timeout 60s)을 그대로 둔다.
            # k6 / nginx / 앱 / DB 의 타임아웃이 어긋난 상태가 P2-14 의 소재다.
            #
            # upstream 헬스체크도 없다 — P2-08 의 소재다. 죽은 인스턴스로도 계속 보낸다.
        }
    }
}
